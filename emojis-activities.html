// اللغة موحدة مع الصفحة الرئيسية
const LANGUAGE_KEY = "emojilandLanguage";

function getPageLanguage(){
  const savedLanguage = localStorage.getItem(LANGUAGE_KEY);

  if(savedLanguage === "ar" || savedLanguage === "en"){
    return savedLanguage;
  }

  const urlLanguage = new URLSearchParams(location.search).get("lang");

  return urlLanguage === "en" ? "en" : "ar";
}

let pageLanguage = getPageLanguage();

function applyPageLanguage(language){
  pageLanguage = language === "en" ? "en" : "ar";

  document.documentElement.lang = pageLanguage;
  document.documentElement.dir = pageLanguage === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-ar][data-en]").forEach(element=>{
    element.textContent = element.getAttribute("data-" + pageLanguage);
  });

  document.getElementById("siteLogo").textContent =
    pageLanguage === "ar" ? "😊 مملكة الإيموش" : "😊 Emojiland";

  document.getElementById("homeLink").textContent =
    pageLanguage === "ar" ? "الرئيسية" : "Home";

  document.getElementById("stickersLink").textContent =
    pageLanguage === "ar" ? "الملصقات" : "Stickers";

  document.title = pageLanguage === "ar"
    ? "إيموشات الأنشطة المتحركة | مملكة الإيموش"
    : "Animated Activities Emoji | Emojiland";

  document.querySelectorAll(".activity-card").forEach(card=>{
    const name = card.querySelector(".activity-name");
    const item = card.dataset.code;

    if(name && item){
      name.textContent = getActivityName(item);
    }

    const buttons = card.querySelectorAll(".activity-actions button");

    if(buttons.length === 2){
      buttons[0].textContent = pageLanguage === "ar" ? "نسخ" : "Copy";

      if(!buttons[1].disabled){
        buttons[1].textContent = pageLanguage === "ar" ? "تنزيل GIF" : "Download GIF";
      }
    }
  });
}

// استقبال أي تغيير للغة من الصفحة الرئيسية أو تبويب آخر
window.addEventListener("storage", event=>{
  if(event.key === LANGUAGE_KEY){
    applyPageLanguage(event.newValue || "ar");
  }
});

function getActivityName(code){
  const item = activities.find(activity=>activity[2] === code);
  if(!item) return "";

  return pageLanguage === "ar"
    ? item[1]
    : (englishNames[code] || item[1]);
}

const grid = document.getElementById("activitiesGrid");
const loading = document.getElementById("loading");
const empty = document.getElementById("emptyMessage");

let loaded = 0;
let finished = 0;

activities.forEach(item=>{
  const card = document.createElement("article");
  card.className = "activity-card";
  card.hidden = true;
  card.dataset.code = item[2];

  const img = document.createElement("img");
  img.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${item[2]}/512.gif`;
  img.alt = item[1];
  img.loading = "lazy";

  img.onload = ()=>{
    loaded++;
    card.hidden = false;

    loading.textContent = pageLanguage === "ar"
      ? "تم تحميل الإيموشات المتاحة"
      : "Available emoji loaded";

    finished++;

    if(finished === activities.length){
      loading.hidden = true;
    }
  };

  img.onerror = ()=>{
    card.remove();
    finished++;

    if(finished === activities.length){
      loading.hidden = true;

      if(loaded === 0){
        empty.hidden = false;
      }
    }
  };

  const name = document.createElement("p");
  name.className = "activity-name";
  name.textContent = getActivityName(item[2]);

  const actions = document.createElement("div");
  actions.className = "activity-actions";

  const copy = document.createElement("button");
  copy.textContent = pageLanguage === "ar" ? "نسخ" : "Copy";

  copy.onclick = ()=>{
    navigator.clipboard.writeText(item[0]).then(()=>{
      alert(pageLanguage === "ar" ? "تم النسخ" : "Copied");
    }).catch(()=>{
      alert(pageLanguage === "ar" ? "تعذر النسخ" : "Unable to copy");
    });
  };

  const download = document.createElement("button");
  download.textContent = pageLanguage === "ar" ? "تنزيل GIF" : "Download GIF";

  download.onclick = async()=>{
    const originalText = pageLanguage === "ar" ? "تنزيل GIF" : "Download GIF";

    download.textContent = pageLanguage === "ar"
      ? "جاري التنزيل..."
      : "Downloading...";

    download.disabled = true;

    try{
      const response = await fetch(img.src);

      if(!response.ok){
        throw new Error("Download failed");
      }

      const blob = await response.blob();

      if(!blob.size){
        throw new Error("Empty file");
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = item[2] + ".gif";

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },5000);

    }catch(error){
      alert(pageLanguage === "ar"
        ? "تعذر تنزيل الإيموش. تأكد من اتصال الإنترنت وحاول مرة أخرى."
        : "Unable to download the emoji. Check your internet connection and try again.");
    }finally{
      download.textContent = originalText;
      download.disabled = false;
    }
  };

  actions.append(copy,download);
  card.append(img,name,actions);
  grid.append(card);
});
