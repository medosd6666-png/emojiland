<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7055ed">

  <meta name="description" content="اكتشف ملصقات إيموش مجانية في مملكة الإيموش. تصفح مكتبة الملصقات، وحمّل ملصقاتك المفضلة أو اصنع ملصقك الخاص بسهولة.">
  <meta name="keywords" content="ايموش, ايموش متحرك, ملصقات إيموش, ملصقات مجانية, صانع ملصقات, ملصقات تعبيرية">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://emojiland.pages.dev/stickers.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="ملصقات إيموش مجانية | مملكة الإيموش">
  <meta property="og:description" content="اكتشف ملصقات إيموش مجانية وحمّلها أو اصنع ملصقك الخاص بسهولة.">
  <meta property="og:url" content="https://emojiland.pages.dev/stickers.html">

  <title>ملصقات إيموش مجانية وصانع الملصقات | مملكة الإيموش</title>

  <link rel="stylesheet" href="style.css">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NZ00TSPTWC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NZ00TSPTWC');
  </script>
</head>

<body>
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">🎨 مملكة الإيموش</a>

      <nav class="nav">
        <a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
        <a href="index.html#emojis" data-ar="الإيموشات" data-en="Emojis">الإيموشات</a>
        <a href="stickers.html" data-ar="الملصقات" data-en="Stickers">الملصقات</a>
      </nav>

      <button id="languageButton" class="language-button" type="button"
        data-ar="English" data-en="العربية">English</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-ar="ملصقات إيموش مجانية" data-en="Free Emoji Stickers">ملصقات إيموش مجانية</h1>
      <p data-ar="اكتشف ملصقات إيموش رائعة وحمّلها، أو اصنع ملصقك الخاص بسهولة."
         data-en="Discover fun emoji stickers, download them, or create your own easily.">
        اكتشف ملصقات إيموش رائعة وحمّلها، أو اصنع ملصقك الخاص بسهولة.
      </p>
    </section>

    <section class="stickers-section">
      <h2 data-ar="مكتبة الملصقات" data-en="Sticker Library">مكتبة الملصقات</h2>

      <input id="stickerSearch" type="search"
        placeholder="ابحث عن ملصق..."
        data-ar-placeholder="ابحث عن ملصق..."
        data-en-placeholder="Search stickers..."
        aria-label="البحث عن ملصقات">

      <div id="stickerGrid" class="sticker-grid"></div>
    </section>

    <section class="maker-section">
      <h2 data-ar="اصنع ملصقك الخاص" data-en="Create Your Own Sticker">اصنع ملصقك الخاص</h2>

      <label for="stickerText" data-ar="اكتب النص" data-en="Enter text">اكتب النص</label>
      <input id="stickerText" type="text" maxlength="40"
        placeholder="اكتب عبارتك هنا"
        data-ar-placeholder="اكتب عبارتك هنا"
        data-en-placeholder="Type your message">

      <label for="stickerEmoji" data-ar="اختر الإيموش" data-en="Choose emoji">اختر الإيموش</label>
      <input id="stickerEmoji" type="text" value="😀" maxlength="8">

      <label for="stickerColor" data-ar="لون الملصق" data-en="Sticker color">لون الملصق</label>
      <input id="stickerColor" type="color" value="#7055ed">

      <canvas id="stickerCanvas" width="600" height="600"></canvas>

      <button id="downloadSticker" type="button"
        data-ar="تحميل الملصق" data-en="Download Sticker">
        تحميل الملصق
      </button>

      <p id="copyMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="currentYear"></span> <span data-ar="مملكة الإيموش" data-en="Emojiland">مملكة الإيموش</span></p>
    <a href="index.html" data-ar="العودة للرئيسية" data-en="Back to Home">العودة للرئيسية</a>
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();
  </script>
</body>
</html>
