
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مجموعة الإيموشات الرومانسية المتحركة، انسخ الرموز أو نزّل صور GIF مجانًا.">
  <meta name="theme-color" content="#7655c5">
  <title>إيموشات الحب المتحركة | مملكة الإيموش</title>

  <script>
    (() => {
      const language = localStorage.getItem("emojilandLanguage") || "ar";
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
    })();
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NZ00TSPTWC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NZ00TSPTWC');
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f8f6fc;
      color: #29243a;
    }

    a { color: inherit; text-decoration: none; }

    header {
      background: #7655c5;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { font-size: 22px; margin: 0; }

    nav {
      background: white;
      padding: 13px 5%;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px #00000008;
    }

    nav a { color: #6545aa; font-size: 14px; }

    main {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h2 { color: #704db9; font-size: 28px; }
    .intro p { color: #777; line-height: 1.8; }

    .status {
      text-align: center;
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin: 20px 0;
      color: #704db9;
    }

    .progress {
      height: 7px;
      background: #eee8f8;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: #8c6bd1;
      transition: width .2s;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 16px;
    }

    .emoji-card {
      background: white;
      border-radius: 15px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: 0 3px 12px #38205c0b;
      border: 1px solid #eee8f7;
    }

    .emoji-card img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }

    .emoji-symbol {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .actions button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      color: white;
      background: #7655c5;
      font-size: 12px;
    }

    .actions button.download { background: #e45d91; }
    .actions button:disabled { opacity: .6; cursor: wait; }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
      display: none;
    }

    footer {
      margin-top: 45px;
      padding: 25px 5%;
      background: white;
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.8;
    }

    footer a { color: #7655c5; text-decoration: underline; }

    @media(max-width: 500px) {
      header h1 { font-size: 18px; }
      .intro h2 { font-size: 23px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>

<header>
  <h1 data-ar="😊 مملكة الإيموش | Emojiland"
      data-en="😊 Emojiland | مملكة الإيموش">😊 مملكة الإيموش | Emojiland</h1>
</header>

<nav>
  <a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
  <a href="stickers.html" data-ar="الملصقات" data-en="Stickers">الملصقات</a>
  <a href="emojis-smileys.html" data-ar="الابتسامات" data-en="Smileys">الابتسامات</a>
</nav>

<main>
  <section class="intro">
    <h2 data-ar="💗 إيموشات الحب المتحركة"
        data-en="💗 Animated Love Emojis">💗 إيموشات الحب المتحركة</h2>

    <p data-ar="إيموشات رومانسية متحركة فعلًا. اضغط على نسخ أو تنزيل."
       data-en="Real animated romantic emojis. Copy or download your favorites.">
       إيموشات رومانسية متحركة فعلًا. اضغط على نسخ أو تنزيل.
    </p>
  </section>

  <div class="status" id="status">
    جاري فحص الإيموشات المتحركة...
    <div class="progress"><span id="progressBar"></span></div>
  </div>

  <section class="grid" id="emojiGrid"></section>
  <div class="empty" id="emptyMessage"></div>
</main>

<footer>
  <p data-ar="رسومات الإيموش المتحركة: Google Animated Noto Emoji."
     data-en="Animated emoji artwork: Google Animated Noto Emoji.">
     رسومات الإيموش المتحركة: Google Animated Noto Emoji.
  </p>

  <p>
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">
      CC BY 4.0
    </a>
    |
    <a href="https://googlefonts.github.io/noto-emoji-animation/" target="_blank" rel="noopener">
      <span data-ar="المصدر والترخيص" data-en="Source and license">المصدر والترخيص</span>
    </a>
  </p>
</footer>

<script>
(() => {
  "use strict";

  const LANGUAGE_KEY = "emojilandLanguage";

  const emojis = [
    {code:"1f970",symbol:"🥰"},
    {code:"1f60d",symbol:"😍"},
    {code:"1f618",symbol:"😘"},
    {code:"1f617",symbol:"😗"},
    {code:"1f619",symbol:"😙"},
    {code:"1f61a",symbol:"😚"},
    {code:"1f48b",symbol:"💋"},
    {code:"1f48c",symbol:"💌"},
    {code:"1f49d",symbol:"💝"},
    {code:"1f496",symbol:"💖"},
    {code:"1f497",symbol:"💗"},
    {code:"1f493",symbol:"💓"},
    {code:"1f49e",symbol:"💞"},
    {code:"1f495",symbol:"💕"},
    {code:"1f49f",symbol:"💟"},
    {code:"2764-fe0f",symbol:"❤️"},
    {code:"1f494",symbol:"💔"},
    {code:"2763-fe0f",symbol:"❣️"},
    {code:"1f917",symbol:"🤗"},
    {code:"1f46b",symbol:"👫"},
    {code:"1f491",symbol:"💑"},
    {code:"1f48f",symbol:"💏"},
    {code:"1f339",symbol:"🌹"},
    {code:"1f490",symbol:"💐"},
    {code:"1f381",symbol:"🎁"}
  ];

  const grid = document.getElementById("emojiGrid");
  const status = document.getElementById("status");
  const progressBar = document.getElementById("progressBar");
  const emptyMessage = document.getElementById("emptyMessage");

  let language = localStorage.getItem(LANGUAGE_KEY) || "ar";
  let loaded = 0;
  let finished = 0;

  function t(ar, en) {
    return language === "ar" ? ar : en;
  }

  function updateLanguage() {
    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-ar][data-en]").forEach(element => {
      element.textContent = element.dataset[language];
    });

    document.title = t(
      "إيموشات الحب المتحركة | مملكة الإيموش",
      "Animated Love Emojis | Emojiland"
    );

    document.querySelector('meta[name="description"]').content = t(
      "مجموعة الإيموشات الرومانسية المتحركة، انسخ الرموز أو نزّل صور GIF مجانًا.",
      "Animated romantic emojis. Copy symbols or download free GIF images."
    );

    updateStatus();
    updateCardButtons();
    updateEmptyMessage();
  }

  function updateStatus() {
    const percent = Math.round((finished / emojis.length) * 100);
    progressBar.style.width = percent + "%";

    status.firstChild.textContent = t(
      `تم فحص ${finished} من ${emojis.length} ملفًا — المتاح: ${loaded}`,
      `Checked ${finished} of ${emojis.length} files — available: ${loaded}`
    );
  }

  function updateCardButtons() {
    document.querySelectorAll(".copy-button").forEach(button => {
      if (!button.dataset.feedback) {
        button.textContent = t("نسخ", "Copy");
      }
    });

    document.querySelectorAll(".download-button").forEach(button => {
      if (!button.disabled) {
        button.textContent = t("تنزيل GIF", "Download GIF");
      }
    });
  }

  function updateEmptyMessage() {
    if (loaded === 0 && finished === emojis.length) {
      emptyMessage.style.display = "block";
      emptyMessage.textContent = t(
        "تعذر تحميل الإيموشات. تأكد من اتصال الإنترنت.",
        "Could not load emojis. Check your internet connection."
      );
    }
  }

  window.addEventListener("storage", event => {
    if (event.key === LANGUAGE_KEY && event.newValue) {
      language = event.newValue === "en" ? "en" : "ar";
      updateLanguage();
    }
  });

  function loadImage(item) {
    return new Promise(resolve => {
      const img = new Image();
      const url =
        `https://fonts.gstatic.com/s/e/notoemoji/latest/${item.code}/512.gif`;

      img.onload = () => resolve({ ...item, img, url });
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  async function copyEmoji(symbol, button) {
    let success = false;

    try {
      await navigator.clipboard.writeText(symbol);
      success = true;
    } catch {
      const area = document.createElement("textarea");
      area.value = symbol;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();

      try {
        success = document.execCommand("copy");
      } catch {
        success = false;
      }

      area.remove();
    }

    button.dataset.feedback = "true";
    button.textContent = success
      ? t("تم النسخ ✓", "Copied ✓")
      : t("تعذر النسخ", "Copy failed");

    setTimeout(() => {
      delete button.dataset.feedback;
      button.textContent = t("نسخ", "Copy");
    }, 1500);
  }

  async function downloadGif(url, code, button) {
    button.disabled = true;
    button.textContent = t("انتظر...", "Please wait...");

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Download failed");

      const blob = await response.blob();
      if (!blob.size) throw new Error("Empty file");

      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = objectUrl;
      link.download = `love-${code}.gif`;
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
    } catch {
      window.open(url, "_blank", "noopener");
    }

    button.disabled = false;
    button.textContent = t("تنزيل GIF", "Download GIF");
  }

  function addEmoji(item) {
    const card = document.createElement("article");
    card.className = "emoji-card";

    const img = item.img;
    img.alt = item.symbol;
    img.loading = "lazy";

    const symbol = document.createElement("div");
    symbol.className = "emoji-symbol";
    symbol.textContent = item.symbol;

    const actions = document.createElement("div");
    actions.className = "actions";

    const copyButton = document.createElement("button");
    copyButton.type = "button";
    copyButton.className = "copy-button";
    copyButton.textContent = t("نسخ", "Copy");

    copyButton.addEventListener("click", () => {
      copyEmoji(item.symbol, copyButton);
    });

    const downloadButton = document.createElement("button");
    downloadButton.type = "button";
    downloadButton.className = "download download-button";
    downloadButton.textContent = t("تنزيل GIF", "Download GIF");

    downloadButton.addEventListener("click", () => {
      downloadGif(item.url, item.code, downloadButton);
    });

    actions.append(copyButton, downloadButton);
    card.append(img, symbol, actions);
    grid.appendChild(card);
  }

  async function loadAll() {
    for (let i = 0; i < emojis.length; i += 8) {
      const batch = emojis.slice(i, i + 8);
      const results = await Promise.all(batch.map(loadImage));

      results.forEach(item => {
        if (item) {
          loaded++;
          addEmoji(item);
        }
      });

      finished += batch.length;
      updateStatus();
    }

    updateEmptyMessage();
  }

  updateLanguage();
  loadAll();
})();
</script>

</body>
</html>
